name: apecs-brillo
version: 0.2.0.1
git: "https://github.com/execute214/apecs-brillo"
license: BSD-3-Clause
author: "Execute"
copyright: "2017 Jonas Carpay, Execute"

extra-doc-files:
- README.md
- CHANGELOG.md

synopsis: Apecs' gloss package, but adapted for brillo.
category: Game engine
description: A library that's meant to bridge the gap between brillo and gloss.

library:
  source-dirs: src

tests:
  apecs-brillo-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - apecs-brillo

executables:
  example-balls:
    main: Main.hs
    source-dirs: examples/balls
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - apecs-brillo

dependencies:
- base >= 4.8 && < 5
- brillo >= 3 && < 4
- brillo-rendering >= 3 && < 4
- apecs >= 0.7 && < 0.11
- linear >= 1.2 && < 2
- containers >= 0.5 && < 0.8

ghc-options:
- -Wall
- -Wcompat
- -Wimplicit-lift
- -Wincomplete-patterns
- -Wincomplete-patterns
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-exported-signatures
- -Wmissing-methods
- -Wmissing-signatures
- -Wname-shadowing
- -Wno-deprecations
- -Wredundant-bang-patterns
- -Wredundant-constraints
- -Wunused-packages

default-extensions:
- TemplateHaskell
- ImportQualifiedPost
- DuplicateRecordFields
- ApplicativeDo
- BlockArguments
- DeriveAnyClass
- DerivingVia
- LambdaCase
- NamedFieldPuns
- NumDecimals
- OverloadedLabels
- OverloadedLists
- OverloadedRecordDot
- OverloadedStrings
- MultiParamTypeClasses
- NoStarIsType
- PatternSynonyms
- RecordWildCards
- StrictData
- BangPatterns
- TypeAbstractions
- TypeFamilies
- FlexibleInstances
- FlexibleContexts
- DataKinds
- TypeOperators
- NoFieldSelectors
- ScopedTypeVariables
- TypeApplications
- TupleSections
- DeriveAnyClass
- DeriveTraversable
- DeriveGeneric
